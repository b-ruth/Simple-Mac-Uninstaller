name: Uninstaller
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Uninstaller:
    type: application
    platform: macOS
    sources:
      - Uninstaller
    info:
      path: Uninstaller/Info.plist
      properties:
        CFBundleDisplayName: Uninstaller
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSAppleEventsUsageDescription: Uninstaller asks Finder to move files that need administrator permission to the Trash.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.Uninstaller
        PRODUCT_NAME: Uninstaller
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: PJFLTNB2J6
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
